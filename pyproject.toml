[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-erp-bridge"
version = "0.1.0"
description = "Model Context Protocol server wrapping a session-cookie-auth ERP. Reference implementation for deploying Claude into messy enterprise systems."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rafael Garcia" }
]
requires-python = ">=3.10"
keywords = ["mcp", "claude", "anthropic", "model-context-protocol", "erp", "enterprise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0,<2.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
mcp-erp-bridge = "mcp_erp_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/mffnxman/mcp-erp-bridge"
Repository = "https://github.com/mffnxman/mcp-erp-bridge"
Issues = "https://github.com/mffnxman/mcp-erp-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
